services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chattui
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chattui"]
      interval: 2s
      timeout: 5s
      retries: 5

  server:
    build: .
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "goose -dir /migrations postgres \"$$DB_URL\" up && exec server"]
    environment:
      DB_URL: postgres://chat:chat@postgres:5432/chattui?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "8080:8080"

  # Run with: docker compose run --rm client
  client:
    build:
      context: .
      dockerfile: client.Dockerfile
    profiles: ["client"]
    depends_on:
      server:
        condition: service_started
    stdin_open: true
    tty: true
    environment:
      SERVER_URL: http://server:8080
      WS_URL: ws://server:8080

volumes:
  pgdata:
