name: test

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # go install compiles from source with the current Go toolchain, avoiding
        # pre-built binary incompatibility with newer Go versions.
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod

      - run: go test -short ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod

      - name: run integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test ./cmd/server/internal/auth/... ./cmd/server/internal/room/... ./cmd/server/internal/inbox/...
